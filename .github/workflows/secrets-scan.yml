# Secrets scan (gate line 4, web). gitleaks, pinned release, checksum-verified
# (the same version and hash modernsmapp's security.yml uses).
#
#   push          the commits in the push (before..after); a new branch or a
#                 force-push whose old head is gone scans the pushed head's
#                 whole history instead (seconds on this repo)
#   pull_request  the PR's commits (base..head)
#   schedule,     every commit of every branch (--all --full-history)
#   dispatch
#
# --redact: a finding prints its rule, file, line, commit and fingerprint,
# never the value. Allow-listed findings live in .gitleaksignore, by
# fingerprint, each with the reason.
#
# The weekly schedule and the manual dispatch run only once this file is on
# the default branch (master); until then the push scan is all that runs.

name: secrets-scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Sunday 02:30 UTC, after modernsmapp's Security run.
    - cron: '30 2 * * 0'

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                 git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$AFTER"
              else
                range="$AFTER"
              fi ;;
            *)
              git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
              range="--all" ;;
          esac
          echo "scanning: $range"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --log-opts="--full-history $range" \
            --gitleaks-ignore-path .gitleaksignore .
